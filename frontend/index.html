<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Dashboard Builder</title>

      <link rel="stylesheet" href="./css/style.css">
</head>

<body>

      <header class="topbar">

            <div class="brand">
                  Dashboard Builder
            </div>

            <div class="topbar-actions">

                  <button id="previewBtn">
                        Preview
                  </button>

                  <button id="saveLayoutBtn">
                        Save Layout
                  </button>

            </div>

      </header>

      <div class="editor-layout">

            <aside class="sidebar">

                  <h3>Components</h3>

                  <button id="addTextBtn">
                        Text Widget
                  </button>

                  <button id="addImageBtn">
                        Image Widget
                  </button>

                  <button id="addGraphBtn">
                        Chart Widget
                  </button>

            </aside>

            <main id="dashboard">

            </main>

      </div>

      <script src="./js/app.js"></script>
      <script src="./js/drag.js"></script>
      <script src="./js/api.js"></script>

</body>

</html>
